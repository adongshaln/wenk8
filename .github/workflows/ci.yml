name: CI 编译验证

# 每次 push / PR 自动编译，无需本地环境：
#   - 绿色 = 代码可编译，可以打 tag 发版
#   - 红色 = 用 gh run view --log-failed 查看报错，修复后重新 push
# 同时产出 debug APK 工件（debug 签名，可直接安装测试）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    name: 编译 Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 设置 Gradle 并启用缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 编译 Debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 Debug APK 工件
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
